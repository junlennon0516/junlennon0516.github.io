<a class="case-card" href="{{ include.post.url | relative_url }}">
  {% if include.post.status %}<div class="card-meta"><span class="status-badge">{{ include.post.status | escape }}</span></div>{% endif %}
  <h3>{{ include.post.title | escape }}</h3>
  <p>{{ include.post.excerpt | strip_html | escape }}</p>
  {% if include.post.tags.size > 0 %}<ul class="card-tags" aria-label="관련 기술">{% for tag in include.post.tags %}<li>{{ tag | escape }}</li>{% endfor %}</ul>{% endif %}
</a>
